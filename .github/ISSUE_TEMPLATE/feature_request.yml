name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先看看 README 与 `docs/reference.md` 是否已有对应开关；功能请求不需要写实现方案。

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      placeholder: "现在只能改 cordis.patch.yml，想直接改阈值……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to look like?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area (optional)
      options:
        - pill
        - panel
        - settings
        - compression
        - rewriting
        - other
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds (optional)
    validations:
      required: false
