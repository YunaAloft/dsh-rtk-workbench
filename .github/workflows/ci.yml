name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push makes an in-flight run pointless; cancel it instead of burning
# runners on a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `macos-13`/`macos-14` are retired. Plain `macos-latest` is arm64; the
        # x64 macOS image (`macos-15-intel`) is deliberately not in this matrix —
        # its queue is long and the JS suite has no arch-specific behaviour. The
        # darwin-x64 *binary* is still exercised by the binary job below.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Actions are pinned to immutable commit SHAs (with the human version in a
      # comment) so a moving major tag cannot change what runs; Dependabot
      # refreshes the pins. See .github/dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node node_modules/typescript/bin/tsc -p tsconfig.client.json --noEmit
      - run: node node_modules/vitest/vitest.mjs run
      - run: node node_modules/tsdown/dist/run.mjs
      - name: repository checks
        # Package requirements and repository-owned documentation checks. No
        # third-party checker is part of the build gate; contributor preferences
        # (README language count, wording heuristics) stay in review.
        run: |
          node scripts/check-manifest.mjs
          node scripts/check-docs.mjs

  binary:
    name: bundled binary (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            asset: rtk-x86_64-unknown-linux-musl.tar.gz
            bin: rtk
            out: rtk-bin
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            asset: rtk-aarch64-unknown-linux-gnu.tar.gz
            bin: rtk
            out: rtk-bin
          - os: macos-15-intel
            platform: darwin-x64
            asset: rtk-x86_64-apple-darwin.tar.gz
            bin: rtk
            out: rtk-bin
          - os: macos-latest
            platform: darwin-arm64
            asset: rtk-aarch64-apple-darwin.tar.gz
            bin: rtk
            out: rtk-bin
          - os: windows-latest
            platform: win32-x64
            asset: rtk-x86_64-pc-windows-msvc.zip
            bin: rtk.exe
            # Windows refuses to spawn a file with no extension, so the smoke
            # binary keeps its `.exe` here.
            out: rtk-bin.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No `pnpm install`: scripts/smoke-rtk.mjs only uses Node built-ins, and
      # skipping the install keeps this job fast and independent of the registry.
      - name: fetch the bundled rtk for this platform
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').dshRtkVersion")
          URL="https://github.com/rtk-ai/rtk/releases/download/v${VERSION}/${{ matrix.asset }}"
          curl -fsSL -o asset "$URL"
          mkdir -p extracted
          # The Windows runner's `tar` is GNU tar, which cannot read zip, so the
          # zip asset is unpacked with `unzip` (bundled with Git for Windows).
          case "${{ matrix.asset }}" in
            *.zip) unzip -q -o asset -d extracted ;;
            *)     tar -xf asset -C extracted ;;
          esac
          BIN=$(find extracted -name "${{ matrix.bin }}" -type f | head -1)
          test -n "$BIN"
          cp "$BIN" "${{ matrix.out }}"
          chmod +x "${{ matrix.out }}"
      - name: smoke the binary and the hook contract
        run: node scripts/smoke-rtk.mjs ./${{ matrix.out }}

  pack:
    # Installs nothing into a harness profile: this job proves the published
    # artifact is complete (files list, host half under plain Node, browser half
    # registration, bundled binary). The deeper `dsh plugin add` smoke is a
    # release-time step in work/dsh-rtk-workbench/runbooks/release-workflow.md.
    name: packaged artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/tsdown/dist/run.mjs
      - name: vendor the rtk binary for this platform
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: cache
          key: rtk-vendor-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: node scripts/build-vendor.mjs
      - run: pnpm pack
      - run: node scripts/smoke-pack.mjs dsh-rtk-workbench-*.tgz
