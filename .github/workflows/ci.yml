name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push makes an in-flight run pointless; cancel it instead of burning
# runners on a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.pick.outputs.unit }}
      binary: ${{ steps.pick.outputs.binary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pick
        # GitHub's macOS arm64 pool cancelled a queued job after fifteen minutes
        # twice in one day. Pull requests therefore skip that pool; main pushes
        # and manual runs keep the full matrix. The matrices themselves live in
        # .github/ci-matrix.json so this job and the jobs below cannot drift.
        run: |
          set -euo pipefail
          collection="${{ github.event_name == 'pull_request' && 'pr' || 'all' }}"
          {
            echo "unit=$(jq -c ".unit.${collection}" .github/ci-matrix.json)"
            # The binary matrix is a list of objects, so it travels as the
            # {"include": [...]} shape that `matrix:` accepts directly.
            echo "binary=$(jq -c "{include: .binary.${collection}}" .github/ci-matrix.json)"
          } >> "$GITHUB_OUTPUT"

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: scope
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `macos-13`/`macos-14` are retired. Plain `macos-latest` is arm64 and the
        # last entry in .github/ci-matrix.json's "all" set; the x64 macOS image
        # (`macos-15-intel`) is deliberately not a unit target — its queue is long
        # and the JS suite has no arch-specific behaviour. The darwin-x64 *binary*
        # is still exercised by the binary job below.
        os: ${{ fromJSON(needs.scope.outputs.unit) }}
    steps:
      # Actions are pinned to immutable commit SHAs (with the human version in a
      # comment) so a moving major tag cannot change what runs; Dependabot
      # refreshes the pins. See .github/dependabot.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node node_modules/typescript/bin/tsc -p tsconfig.client.json --noEmit
      - run: node node_modules/vitest/vitest.mjs run
      - run: node node_modules/tsdown/dist/run.mjs
      - name: repository checks
        # Package requirements and repository-owned documentation checks. No
        # third-party checker is part of the build gate; contributor preferences
        # (README language count, wording heuristics) stay in review.
        run: |
          node scripts/check-manifest.mjs
          node scripts/check-docs.mjs

  binary:
    name: bundled binary (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: scope
    timeout-minutes: 10
    # Same macOS arm64 capacity rule as the unit job: the pull_request collection
    # in .github/ci-matrix.json omits darwin-arm64.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.binary) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No `pnpm install`: scripts/smoke-rtk.mjs only uses Node built-ins, and
      # skipping the install keeps this job fast and independent of the registry.
      - name: cache the rtk release asset
        # The asset is content-stable for a given rtk version, so a hit removes
        # the download (and its CDN flakiness) from almost every run. The cache is
        # only saved after the job succeeds, so a corrupt download cannot be
        # cached: it would fail extraction or the smoke step first.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rtk-asset
          key: rtk-asset-${{ matrix.platform }}-${{ hashFiles('package.json') }}
      - name: fetch the bundled rtk for this platform
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').dshRtkVersion")
          URL="https://github.com/rtk-ai/rtk/releases/download/v${VERSION}/${{ matrix.asset }}"
          mkdir -p rtk-asset
          if [ -f "rtk-asset/${{ matrix.asset }}" ]; then
            echo "using the cached asset"
            cp "rtk-asset/${{ matrix.asset }}" asset
          else
            # GitHub's release CDN answers 504 under load; give it a two-minute
            # window (5 attempts, 5 s apart) and also retry connection-level
            # failures, which the default retry set ignores.
            curl -fsSL --retry 5 --retry-delay 5 --retry-max-time 120 --retry-all-errors -o asset "$URL"
            cp asset "rtk-asset/${{ matrix.asset }}"
          fi
          mkdir -p extracted
          # The Windows runner's `tar` is GNU tar, which cannot read zip, so the
          # zip asset is unpacked with `unzip` (bundled with Git for Windows).
          case "${{ matrix.asset }}" in
            *.zip) unzip -q -o asset -d extracted ;;
            *)     tar -xf asset -C extracted ;;
          esac
          BIN=$(find extracted -name "${{ matrix.bin }}" -type f | head -1)
          test -n "$BIN"
          cp "$BIN" "${{ matrix.out }}"
          chmod +x "${{ matrix.out }}"
      - name: smoke the binary and the hook contract
        run: node scripts/smoke-rtk.mjs ./${{ matrix.out }}

  pack:
    # Installs nothing into a harness profile: this job proves the published
    # artifact is complete (files list, host half under plain Node, browser half
    # registration, bundled binary). The deeper `dsh plugin add` smoke is a
    # release-time step in work/dsh-rtk-workbench/runbooks/release-workflow.md.
    name: packaged artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/tsdown/dist/run.mjs
      - name: vendor the rtk binary for this platform
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          key: rtk-vendor-${{ runner.os }}-${{ hashFiles('package.json') }}
      - run: node scripts/build-vendor.mjs
      - run: pnpm pack
      - run: node scripts/smoke-pack.mjs dsh-rtk-workbench-*.tgz
      # The GitHub-shape tarball must carry the same documentation: its README
      # links to docs/ and CHANGELOG.md, and both used to be missing here.
      - run: node scripts/smoke-pack.mjs dist/github/dsh-rtk-workbench-linux-x64.tgz
